<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkTodos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>InkTodos</h1>
            <p class="date-display" id="current-date"></p>
        </header>
        
        <main>
            <form id="task-form">
                <input type="text" id="task-input" placeholder="Add new task..." aria-label="Add new task">
                <button type="submit" id="add-task-btn">Add</button>
            </form>
            
            <div class="task-list-container">
                <h2>Today's Tasks</h2>
                <ul id="task-list"></ul>
            </div>
        </main>
        
        <footer>
            <p>Tap a task to mark it complete • <span id="storage-status">✓ Storage enabled</span></p>
        </footer>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
